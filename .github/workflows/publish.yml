name: Publish

# Publishing is driven by version tags: `git tag -a v1.2.3 && git push origin v1.2.3`.
# The tag must point at a commit whose pubspec `version:` matches the tag.
#
# Requires automated publishing to be enabled once, by hand, at
# https://pub.dev/packages/flutter_drag_auto_scroll/admin
# (Automated publishing -> Enable publishing from GitHub Actions, repository
# MaibornWolff/flutter_drag_auto_scroll, tag pattern v{{version}}).
# Until then this workflow fails at the publish step with
# `Only users are allowed to upload new packages.` -- pub.dev will not accept
# an OIDC upload for a package that does not exist yet, so the very first
# release has to be pushed by hand with `flutter pub publish`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that pub.dev exchanges for a short-lived
      # publishing credential, so no long-lived secret is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Performs the OIDC handshake and writes the pub credentials that the
      # publish step below picks up. Must run before flutter-action.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Deliberately no `flutter pub get` here, matching the `package` job in
      # ci.yml. The Flutter tool rewrites analysis_options.yaml (injecting
      # `analyzer: exclude:`) and re-resolves example/pubspec.lock during
      # resolution, which left every release publishing from a tree `pub`
      # reports as dirty ("2 checked-in files are modified in git"). `dart pub`
      # publishes without mutating tracked files; flutter-action exports
      # FLUTTER_ROOT, so the `sdk: flutter` dependencies still resolve.

      # Guards the above: if a future SDK dirties the tree anyway, this prints
      # exactly what changed rather than burying it in the publish output.
      - name: Show working tree state
        run: |
          git status --porcelain
          git diff

      # --force skips the interactive confirmation, not the validation; the
      # archive is still checked exactly as `--dry-run` checks it in ci.yml.
      - name: Publish
        run: dart pub publish --force
