name: flutter_drag_auto_scroll
description: Auto-scroll any vertically scrollable widget when a Draggable enters its top or bottom edge zones. Supports same-tree and cross-tree usage.
version: 0.1.0
repository: https://github.com/MaibornWolff/flutter_drag_auto_scroll
issue_tracker: https://github.com/MaibornWolff/flutter_drag_auto_scroll/issues

topics:
  - drag-and-drop
  - scrolling
  - draggable
  - ui

screenshots:
  - description: 'Reordering a playlist by dragging, with the list auto-scrolling at the edge zones.'
    path: example/screenshots/playlist_demo.webp
  - description: 'Assigning team members to backlog tasks across two widget subtrees sharing one controller.'
    path: example/screenshots/sprint_demo.webp

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
